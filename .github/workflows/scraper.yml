# Ejecuta el scraper de forma RECURRENTE y guarda los resultados en Firestore.
# La web (Vercel/Netlify) escucha Firestore en vivo, así que se actualiza sola.
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   FIREBASE_PROJECT_ID        id del proyecto de Firebase
#   FIREBASE_SERVICE_ACCOUNT   contenido COMPLETO del .json de la cuenta de servicio
#
# Variable opcional:
#   PUBLICAR_JSON = true  → además hace commit de web/data/deals.json (respaldo y modo sin Firebase en la web)

name: Scraper PrecioPixel

on:
  schedule:
    # Corrida normal: cada 4 horas (UTC). GitHub no garantiza la hora: cuando está cargado retrasa
    # las corridas programadas y descarta algunas. El minuto 23 evita el inicio de la hora.
    - cron: "23 */4 * * *"
    # PRUEBA TEMPORAL: cada 5 minutos para comprobar que se actualiza solo. Se apaga sola a las
    # 00:30 UTC del 19 nov (6:30 p. m. en México): desde esa hora estas corridas no hacen nada.
    - cron: "*/5 * * * *"
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
    inputs:
      limite:
        description: "Procesar solo los primeros N juegos (vacío = todos)"
        required: false

concurrency:
  group: scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Decidir si corre
        id: decidir
        run: |
          CORRER=true
          if [ "${{ github.event.schedule }}" = "*/5 * * * *" ] && [ "$(date -u +%s)" -gt "$(date -u -d '2026-11-19T00:30:00Z' +%s)" ]; then
            CORRER=false
            echo "Terminó la prueba de cada 5 minutos: esta corrida no hace nada."
          fi
          echo "correr=$CORRER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.decidir.outputs.correr == 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.decidir.outputs.correr == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Compilar
        if: steps.decidir.outputs.correr == 'true'
        run: dotnet build scraper -c Release

      - name: Scraping (3 niveles de paralelismo)
        if: steps.decidir.outputs.correr == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.limite }}" ]; then EXTRA="--limite ${{ github.event.inputs.limite }}"; fi
          dotnet run --project scraper -c Release --no-build -- scrape $EXTRA

      - name: Publicar respaldo JSON (opcional)
        if: ${{ steps.decidir.outputs.correr == 'true' && vars.PUBLICAR_JSON == 'true' }}
        run: |
          git config user.name "preciopixel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/deals.json
          git diff --cached --quiet || git commit -m "Actualizar precios $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
